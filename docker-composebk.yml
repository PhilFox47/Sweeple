services:
  sweeple:
    build: .
    container_name: sweeple
    restart: always
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      BGG_USERNAME: ${BGG_USERNAME}
      BGG_FETCH_MODE: ${BGG_FETCH_MODE:-auto}
      BGG_COOKIE: ${BGG_COOKIE:-}
      BGG_USER_AGENT: ${BGG_USER_AGENT:-}
      BGG_TOKEN: ${BGG_TOKEN:-}
      NANOGPT_API_KEY: ${NANOGPT_API_KEY:-}
      NANOGPT_MODEL: ${NANOGPT_MODEL:-}
      NANOGPT_BASE_URL: ${NANOGPT_BASE_URL:-https://nano-gpt.com/api/v1}
      NANOGPT_BATCH_SIZE: ${NANOGPT_BATCH_SIZE:-10}
      NANOGPT_BATCH_PAUSE_MS: ${NANOGPT_BATCH_PAUSE_MS:-5000}
    volumes:
      - sweeple-data:/data

volumes:
  sweeple-data:
