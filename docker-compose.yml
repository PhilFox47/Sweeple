services:
  sweeple:
    build: .
    container_name: sweeple
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      BGG_USERNAME: ${BGG_USERNAME}
      BGG_FETCH_MODE: ${BGG_FETCH_MODE:-auto}
      BGG_COOKIE: ${BGG_COOKIE:-}
      BGG_USER_AGENT: ${BGG_USER_AGENT:-}
      BGG_TOKEN: ${BGG_TOKEN:-}
    volumes:
      - sweeple-data:/data

volumes:
  sweeple-data:
